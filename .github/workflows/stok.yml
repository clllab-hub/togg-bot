name: Togg Stok Kontrol

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mesaji:
        description: "Telegram'a test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stok-kontrol
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneyi kur
        run: pip install requests

      - name: Stok kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_COOKIE: ${{ secrets.REQUEST_COOKIE }}
          REQUEST_AUTH: ${{ secrets.REQUEST_AUTH }}
          TEST_MESAJI: ${{ inputs.test_mesaji }}
        run: python kontrol.py

      - name: Durumu kaydet
        run: |
          if [ -f durum.json ] && [ -n "$(git status --porcelain durum.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add durum.json
            git commit -m "Stok durumu güncellendi"
            git push
          fi
